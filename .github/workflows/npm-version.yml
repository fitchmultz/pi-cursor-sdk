name: npm version

on:
  push:
    branches: [main]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [npm release]
    types: [completed]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: npm-version-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: >-
      vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'fitchmultz' &&
      (github.event_name != 'check_run' ||
        github.event.check_run.app.slug == 'pi-durable' || github.event.check_run.app.slug == 'cursor') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    uses: fitchmultz/.github/.github/workflows/npm-release-bump.yml@81643f314e88cba668cc68c2d06abcefcbba44ee # main
    with:
      automation-ref: 81643f314e88cba668cc68c2d06abcefcbba44ee # main
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      package-qualified: true
      version-reviewed: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      PI_DURABLE_ACCESS_TOKEN: ${{ secrets.PI_DURABLE_ACCESS_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CURSOR_CATALOG_API_KEY: ${{ secrets.CURSOR_CATALOG_API_KEY }}
