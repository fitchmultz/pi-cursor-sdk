name: Pi compatibility check

on:
  workflow_call:

jobs:
  compatibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      PI_CURSOR_SETTING_SOURCES: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:compat
      - run: node scripts/ci-compatibility.mjs

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PI_OFFLINE: '1'
      PI_TELEMETRY: '0'
      PI_CURSOR_SETTING_SOURCES: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node -e "require('node-pty')"
      - run: npm run check:platform-smoke
      - run: npm test -- --testTimeout=15000
      - run: npm run typecheck
      - run: npm pack --dry-run
