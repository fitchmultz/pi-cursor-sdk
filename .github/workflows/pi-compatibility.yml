name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@a78d00c02fa2f3c05fe53b082f0a338150981a65 # v1.0.0
    with:
      automation-ref: a78d00c02fa2f3c05fe53b082f0a338150981a65 # v1.0.0
