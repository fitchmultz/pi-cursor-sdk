name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@425f6367e5c5d997cac271b011d9cce76cd57d6c # v1.0.0
    with:
      automation-ref: 425f6367e5c5d997cac271b011d9cce76cd57d6c # v1.0.0
