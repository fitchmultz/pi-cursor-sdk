name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@736c45701fe96157644479a91fe507bea3135d22 # v1.0.0
    with:
      automation-ref: 736c45701fe96157644479a91fe507bea3135d22 # v1.0.0
