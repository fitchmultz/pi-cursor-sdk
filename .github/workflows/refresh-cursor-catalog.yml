name: Refresh Cursor model catalog

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-cursor-catalog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh bundled Cursor model catalog
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'fitchmultz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - id: app
        name: Mint release App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.3'
          check-latest: true
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: refresh
        name: Refresh bundled Cursor fallback snapshot
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_CATALOG_API_KEY }}
        run: |
          set -euo pipefail
          npm run refresh:cursor-snapshots -- --write
          unexpected="$(git status --porcelain --untracked-files=all | grep -v '^ M src/cursor-fallback-models\.generated\.ts$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected working tree changes after catalog refresh:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- src/cursor-fallback-models.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundled Cursor fallback catalog already matches live Cursor models."
            exit 0
          fi
          header_line="$(grep -m1 '^// Generated with ' src/cursor-fallback-models.generated.ts || true)"
          printf 'header=%s\n' "$header_line" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update catalog refresh PR
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          base: main
          branch: chore/refresh-cursor-catalog
          add-paths: src/cursor-fallback-models.generated.ts
          sign-commits: true
          commit-message: 'chore(catalog): refresh Cursor fallback model snapshots'
          title: 'chore(catalog): refresh Cursor fallback model snapshots'
          body: |
            Automated daily refresh of the bundled Cursor fallback model snapshot (`src/cursor-fallback-models.generated.ts`) from Cursor's live `Cursor.models.list()` catalog.

            - Snapshot header: `${{ steps.refresh.outputs.header }}`
            - Source workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Auto-merge is intentionally disabled; review the generated diff and CI checks before merging.
